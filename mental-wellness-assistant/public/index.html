<!DOCTYPE html>
<!-- No dir="rtl": the RN styles already lay out right-to-left explicitly (row-reverse / textAlign right); a document-level RTL would flip them back. -->
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1233" />
    <meta name="description" content="همراز — همراه صوتی شما برای حال خوب، خانواده و کارهای روزمره" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Fill the viewport so React Native's flex:1 screens get full height. */
      html, body { height: 100%; margin: 0; background-color: #0B1233; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>برای استفاده از یاور، جاوااسکریپت را فعال کنید.</noscript>
    <div id="root"></div>
  </body>
</html>
