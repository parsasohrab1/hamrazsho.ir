# Production stack: Postgres + API + Caddy (automatic HTTPS via Let's Encrypt).
# Usage on the server:
#   cp .env.example .env   # fill in real secrets, NODE_ENV=production
#   API_DOMAIN=api.hamrazsho.ir POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hamraz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hamraz
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamraz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://hamraz:${POSTGRES_PASSWORD}@postgres:5432/hamraz?schema=public
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pg_data:
  uploads:
  caddy_data:
