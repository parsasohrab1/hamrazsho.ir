
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hamraz
      POSTGRES_PASSWORD: hamraz_dev_password
      POSTGRES_DB: hamraz
    ports:
      - "5432:5432"
    volumes:
      - hamraz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamraz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hamraz:hamraz_dev_password@postgres:5432/hamraz?schema=public
    ports:
      - "4000:4000"
    volumes:
      - hamraz_uploads:/app/uploads

volumes:
  hamraz_postgres_data:
  hamraz_uploads:
